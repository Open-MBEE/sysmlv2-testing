[project]
name = "sysmlv2-testing"
version = "0.1.0"
description = "A knowledge-graph testing ledger (EARL + PROV-O) for SysML v2 implementations"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.29",
    "typer>=0.12",
    "opensysml==0.9.0",
]

[project.scripts]
svt = "sysmlv2_testing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysmlv2_testing"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "owlrl>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
